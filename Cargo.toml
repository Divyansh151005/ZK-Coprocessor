[workspace]
members = [
    "lib",
    "host",
    "crates/orchestrator",
    "crates/header-commitment",
    "sdk/guest",
    "cli",
]
# SP1 RISC-V guest builds via `cargo prove` / sp1 toolchain (not default host cargo).
exclude = ["guest"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alloy-sol-types = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha3 = "0.10"
sha2 = "0.10"
rlp = "0.5"
